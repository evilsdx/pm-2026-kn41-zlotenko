<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
<rect width="360" height="640" rx="28" fill="#e8edf2"/><rect x="18" y="18" width="324" height="604" rx="24" fill="#fff"/>
<rect x="18" y="18" width="324" height="68" rx="24" fill="#2879b9"/><path d="M18 62h324v24H18z" fill="#2879b9"/><text x="42" y="59" fill="white" font-family="Arial" font-size="18" font-weight="700">Деканат • бот</text>
<text x="38" y="130" fill="#536273" font-family="Arial" font-size="13">Сьогодні, 10:15</text><rect x="34" y="148" width="270" height="86" rx="16" fill="#f0f3f6"/><text x="52" y="178" fill="#253443" font-family="Arial" font-size="15"><tspan x="52" dy="0">Вітаю! Щоб користуватися</tspan><tspan x="52" dy="22">послугами деканату, підтвердіть,</tspan><tspan x="52" dy="22">що ви студент академії.</tspan></text>
<rect x="54" y="260" width="252" height="54" rx="14" fill="#2ca36b"/><text x="180" y="293" fill="white" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Надіслати мій контакт</text>
<rect x="34" y="338" width="286" height="80" rx="16" fill="#e6f5ec"/><text x="52" y="367" fill="#216b45" font-family="Arial" font-size="15"><tspan x="52" dy="0">Контакт підтверджено.</tspan><tspan x="52" dy="22">Ви увійшли як студент академії.</tspan></text>
<rect x="34" y="446" width="286" height="56" rx="14" fill="#2879b9"/><text x="177" y="480" fill="white" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Відкрити головне меню</text><text x="180" y="580" fill="#8794a1" text-anchor="middle" font-family="Arial" font-size="12">Ескіз потоку S-01 • авторизація</text></svg>
